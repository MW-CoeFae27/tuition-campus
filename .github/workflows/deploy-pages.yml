name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
    paths: [index.html, app.js, config.js, styles.css, .github/workflows/deploy-pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html app.js config.js styles.css .nojekyll _site/
          sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA::7}\"/; s/config\.js\"/config.js?v=${GITHUB_SHA::7}\"/; s/styles\.css\"/styles.css?v=${GITHUB_SHA::7}\"/" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
